<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" fill="none">
  <defs>
    <filter id="launcherShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="deskBg" x1="0" y1="0" x2="920" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Simulated Dimmed Desktop Wallpaper -->
  <rect width="920" height="540" rx="20" fill="url(#deskBg)"/>

  <!-- Header Caption -->
  <text x="36" y="40" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Rico Global Keyboard Command Launcher (560 × 340 px)</text>
  <text x="36" y="60" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Triggered anywhere via Ctrl+Shift+R (Windows &amp; Linux X11/Wayland Portal) or Cmd+Shift+R (macOS)</text>

  <!-- Floating 560x340 Spotlight Window -->
  <g transform="translate(180, 102)" filter="url(#launcherShadow)">
    <rect width="560" height="340" rx="16" fill="#FFFFFF" stroke="#DCE7F3" stroke-width="1.5"/>

    <!-- Top Input Bar (54px) -->
    <path d="M16 0 H544 A16 16 0 0 1 560 16 V54 H0 V16 A16 16 0 0 1 16 0 Z" fill="#FFFFFF"/>
    <line x1="0" y1="54" x2="560" y2="54" stroke="#E2ECF6"/>

    <rect x="16" y="13" width="28" height="28" rx="8" fill="#2563EB"/>
    <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">⌘</text>

    <text x="56" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#0F172A">Pay Spotify Premium now</text>
    <!-- Caret -->
    <line x1="226" y1="18" x2="226" y2="36" stroke="#2563EB" stroke-width="2"/>

    <rect x="462" y="13" width="52" height="28" rx="8" fill="#0F172A"/>
    <text x="475" y="31" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Run ↵</text>

    <rect x="520" y="13" width="26" height="28" rx="7" fill="#F8FAFC" stroke="#E2ECF6"/>
    <text x="529" y="31" font-family="Inter, sans-serif" font-size="12" fill="#64748B">×</text>

    <!-- Body Area -->
    <rect x="0" y="54" width="560" height="250" fill="#F8FAFC"/>

    <!-- Streamed Rico Agent Response Card -->
    <g transform="translate(16, 68)">
      <rect width="528" height="72" rx="12" fill="#FFFFFF" stroke="#DCE7F3"/>
      <text x="14" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Rico Agent · Verified Payment Quote</text>
      <text x="14" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Ready to pay Spotify Premium: $11.99 USD (rule cap $15.00, period 2026-11).</text>
      <text x="14" y="60" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" fill="#52637A">Nothing is charged until you confirm the signed token below.</text>
    </g>

    <!-- Two-Step HMAC confirmToken Card -->
    <g transform="translate(16, 150)">
      <rect width="528" height="62" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="14" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#0F172A">Confirm Spotify Premium — $11.99 USD</text>
      <text x="14" y="45" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#52637A">Cap $15.00 · Period Nov 2026 · HMAC confirmToken (5m TTL)</text>

      <rect x="400" y="15" width="114" height="32" rx="8" fill="#2563EB"/>
      <text x="416" y="35" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">✓ Confirm Pay</text>
    </g>

    <!-- Quick Suggestion Chips Row -->
    <g transform="translate(16, 224)">
      <text x="2" y="12" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.5">QUICK COMMAND CHIPS (IDLE STATE)</text>

      <rect x="0" y="20" width="168" height="28" rx="8" fill="#FFFFFF" stroke="#DCE7F3"/>
      <text x="10" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#334155">Check my AWS &amp; SaaS spend</text>

      <rect x="176" y="20" width="166" height="28" rx="8" fill="#FFFFFF" stroke="#DCE7F3"/>
      <text x="186" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#334155">Set a $20/mo cap on Cursor</text>

      <rect x="350" y="20" width="178" height="28" rx="8" fill="#FFFFFF" stroke="#DCE7F3"/>
      <text x="360" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#334155">Find AI founder cloud credits</text>
    </g>

    <!-- Bottom Hint Footer (36px) -->
    <path d="M0 304 H560 V324 A16 16 0 0 1 544 340 H16 A16 16 0 0 1 0 324 V304 Z" fill="#FFFFFF"/>
    <line x1="0" y1="304" x2="560" y2="304" stroke="#E2ECF6"/>
    <text x="16" y="326" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#64748B">Global Shortcut: Ctrl+Shift+R / ⌘⇧R</text>
    <text x="434" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748B">Press Esc to dismiss</text>
  </g>
</svg>
