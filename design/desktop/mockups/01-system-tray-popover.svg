  <!-- Title & OS Context Header -->
  <text x="36" y="42" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Rico Desktop — System-Tray / Menu-Bar Spend Popover (380 × 520 px)</text>
  <text x="36" y="62" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52637A">Frameless Tauri v2 popover anchored to Windows 11 Taskbar, macOS Menu Bar, and Linux GNOME / KDE AppIndicator</text>

  <!-- Left Column: OS Tray Anchoring Strip Previews -->
  <g transform="translate(36, 92)">
    <rect width="410" height="156" rx="14" fill="#FFFFFF" stroke="#DCE7F3"/>
    <text x="18" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#52637A" letter-spacing="0.5">CROSS-PLATFORM TRAY ANCHORING STATES</text>

