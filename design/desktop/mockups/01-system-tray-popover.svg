    <text x="18" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#52637A" letter-spacing="0.5">TAURI V2 POPOVER LAYOUT &amp; GUARDRAIL RULES</text>

    <g font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#334155">
      <text x="18" y="56" font-weight="600" fill="#0F172A">1. Fixed 380 × 520 Viewport</text>
      <text x="18" y="74" fill="#52637A">Frameless (`decorations: false`), `alwaysOnTop: true`,</text>
      <text x="18" y="90" fill="#52637A">`skipTaskbar: true`, 12px outer corner radius.</text>

      <text x="18" y="120" font-weight="600" fill="#0F172A">2. Live Monthly Burn Card</text>
      <text x="18" y="138" fill="#52637A">Tabular monospace numerals (`$46.48 / $60.00 cap`),</text>
      <text x="18" y="154" fill="#52637A">utilization bar turns `#DC2626` above 90% ceiling.</text>

      <text x="18" y="184" font-weight="600" fill="#0F172A">3. One-Tap Held Payment Resolution</text>
      <text x="18" y="202" fill="#52637A">Displays Price Sentinel spike % against baseline.</text>
      <text x="18" y="218" fill="#52637A">`Approve Once` &amp; `Cancel` enforce atomic server</text>
      <text x="18" y="234" fill="#52637A">idempotency (`POST /api/sentinel/webhook`).</text>

      <text x="18" y="264" font-weight="600" fill="#0F172A">4. 24-Hour Free-Trial Watchdog</text>
      <text x="18" y="282" fill="#52637A">Surfaces trials converting within 24h (`#FFF7ED` card)</text>
      <text x="18" y="298" fill="#52637A">with instant `Cancel Trial` pause remediation.</text>

      <text x="18" y="326" font-weight="600" fill="#2563EB">5. Zero-Plaintext Footer Status</text>
    </g>
  </g>

