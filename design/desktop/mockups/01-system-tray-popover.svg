      <rect x="294" y="26" width="46" height="17" rx="8.5" fill="#DCFCE7"/>
      <text x="302" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#15803D">ACTIVE</text>

      <line x1="0" y1="50" x2="352" y2="50" stroke="#EDF3FA"/>

      <text x="12" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="500" fill="#0F172A">Spotify Premium</text>
      <text x="242" y="70" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#0F172A">$11.99</text>
