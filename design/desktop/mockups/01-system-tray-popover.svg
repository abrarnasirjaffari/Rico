    <rect x="282" y="83" width="22" height="18" rx="4" fill="#2563EB"/>
    <circle cx="293" cy="92" r="4.5" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="302" cy="85" r="3" fill="#F59E0B"/>
    <text x="312" y="96" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#E2E8F0">AppIndicator</text>

