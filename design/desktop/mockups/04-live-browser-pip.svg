<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" fill="none">
  <defs>
    <filter id="pipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="920" height="460" rx="20" fill="#F1F5F9"/>

  <text x="36" y="42" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Rico Compact Live Browser Verification Window — PiP Mode (420 × 280 px)</text>
  <text x="36" y="62" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52637A">Mini Picture-in-Picture CDP screencast view when Rico verifies live merchant DOM pricing in the background</text>

  <!-- Compact 420x280 PiP Window -->
  <g transform="translate(250, 104)" filter="url(#pipShadow)">
    <rect width="420" height="280" rx="14" fill="#FFFFFF" stroke="#DCE7F3" stroke-width="1.5"/>

    <!-- Top Chrome Bar (38px) -->
    <path d="M14 0 H406 A14 14 0 0 1 420 14 V38 H0 V14 A14 14 0 0 1 14 0 Z" fill="#FFFFFF"/>
    <line x1="0" y1="38" x2="420" y2="38" stroke="#E2ECF6"/>

    <circle cx="18" cy="19" r="4.5" fill="#16A34A"/>
    <rect x="30" y="9" width="256" height="20" rx="6" fill="#F8FAFC" stroke="#E2ECF6"/>
    <text x="40" y="23" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">https://www.netflix.com/signup/planform</text>

    <rect x="294" y="9" width="84" height="20" rx="10" fill="#EFF6FF"/>
    <text x="304" y="22" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="600" fill="#1D4ED8">live_browser</text>

    <text x="394" y="24" font-family="Inter, sans-serif" font-size="13" fill="#64748B">×</text>

    <!-- Blue Progress Shimmer Line -->
    <rect x="0" y="38" width="420" height="2.5" fill="#EDF3FA"/>
    <rect x="0" y="38" width="290" height="2.5" fill="#2563EB"/>

    <!-- Simulated Merchant DOM Viewport -->
    <rect x="14" y="52" width="392" height="174" rx="10" fill="#F8FAFC" stroke="#E2ECF6"/>
    <text x="28" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#64748B">HEADLESS CHROMIUM CDP STREAM · 30 FPS</text>

    <!-- Highlighted Extracted Plan Box -->
    <rect x="28" y="90" width="178" height="118" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
    <rect x="136" y="98" width="60" height="16" rx="8" fill="#DBEAFE"/>
    <text x="144" y="109" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1D4ED8">@e4 DOM</text>
    <text x="40" y="114" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Standard HD</text>
    <text x="40" y="132" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#52637A">1080p · 2 Simultaneous Streams</text>
    <text x="40" y="168" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" fill="#0F172A">$15.49</text>
    <text x="116" y="168" font-family="Inter, sans-serif" font-size="10.5" fill="#64748B">/ month</text>
    <text x="40" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#15803D">✓ Within $20.00 ceiling</text>

    <!-- Secondary Unselected Plan Box -->
    <rect x="218" y="90" width="174" height="118" rx="10" fill="#FFFFFF" stroke="#DCE7F3"/>
    <text x="230" y="114" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#334155">Premium 4K</text>
    <text x="230" y="132" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#64748B">4K HDR · 4 Streams</text>
    <text x="230" y="168" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" fill="#475569">$22.99</text>
    <text x="230" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#B45309">Exceeds $20.00 cap</text>

    <!-- Bottom Status Strip (40px) -->
    <path d="M0 240 H420 V266 A14 14 0 0 1 406 280 H14 A14 14 0 0 1 0 266 V240 Z" fill="#FFFFFF"/>
    <line x1="0" y1="240" x2="420" y2="240" stroke="#E2ECF6"/>
    <text x="14" y="264" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#0F172A">DOM Price Verified: $15.49 USD</text>

    <rect x="308" y="248" width="98" height="24" rx="6" fill="#F8FAFC" stroke="#DCE7F3"/>
    <text x="320" y="264" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="600" fill="#2563EB">Take Over Tab</text>
  </g>
</svg>
