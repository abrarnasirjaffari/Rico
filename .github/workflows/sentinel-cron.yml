name: 🕒 Rico 24/7 Price Sentinel Daily Audit

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel-audit:
    name: Trigger Daily Price Sentinel Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger POST /api/cron/sentinel
        env:
          RICO_PRODUCTION_URL: ${{ secrets.RICO_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RICO_PRODUCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Skipping remote Sentinel cron trigger because RICO_PRODUCTION_URL or CRON_SECRET is not set in repository secrets yet."
            exit 0
          fi

          TARGET_URL="${RICO_PRODUCTION_URL%/}/api/cron/sentinel"
          echo "Triggering Price Sentinel daily audit at $TARGET_URL..."

          HTTP_STATUS=$(curl -sS -o /tmp/sentinel_response.json -w "%{http_code}" \
            -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300)

          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/sentinel_response.json
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 409 ]; then
            echo "✅ Sentinel daily audit completed (HTTP $HTTP_STATUS)."
          else
            echo "::error::Sentinel daily audit failed with HTTP $HTTP_STATUS"
            exit 1
          fi
