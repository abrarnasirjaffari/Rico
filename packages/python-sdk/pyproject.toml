[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rico-py"
version = "0.1.0"
description = "Zero-dependency Python 3.10+ SDK and guardrail decorator for the Rico FinOps & Agentic Commerce API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["rico_sdk*"]
