[package]
name = "rico-desktop"
version = "0.1.0"
description = "Rico Desktop Companion — Spend monitor & payment hold approvals"
authors = ["Rico Contributors"]
edition = "2021"

[lib]
name = "rico_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
